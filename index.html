<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>1.8×10³⁰分の1</title>
<style>
/* Layout: one living thing fills the screen; HUD band on top, the "protect" button at the bottom; cards float over the scene. */
:root {
  color-scheme: dark;
  --ink: #060a14;
  --ink-2: #0f1628;
  --paper: #f1f4fb;
  --mist: #9ba6bf;
  --gold: #ffd479;
  --mint: #8ff0c8;
  --coral: #ff8a7a;
  --sky: #8fd3ff;
  --violet: #c7a6ff;
  --alert: #ff6b5e;
  --veil: rgba(9, 14, 28, .9);
  --hair: rgba(241, 244, 251, .15);
  --font-display: "Avenir Next", "Futura", "Hiragino Maru Gothic ProN", "Hiragino Sans", "Segoe UI", system-ui, sans-serif;
  --font-body: "Hiragino Maru Gothic ProN", "Hiragino Sans", "Yu Gothic UI", "Meiryo", "Noto Sans JP", system-ui, sans-serif;
  --font-num: ui-rounded, "SF Pro Rounded", "Hiragino Maru Gothic ProN", "Avenir Next", "Segoe UI", system-ui, sans-serif;
}
*, *::before, *::after { box-sizing: border-box; }
html { height: 100%; background: var(--ink); }
body { height: 100%; margin: 0; overflow: hidden; background: var(--ink); color: var(--paper); font-family: var(--font-body); -webkit-text-size-adjust: 100%; }
[hidden] { display: none !important; }
#app { position: relative; width: 100%; height: 100%; overflow: hidden; touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; overscroll-behavior: none; }
#cv { position: absolute; left: 0; top: 0; display: block; touch-action: none; }
#field { position: absolute; left: 0; top: 0; pointer-events: none; font-size: 16px; }
button { font-family: inherit; }

/* ---------- life HUD ---------- */
#hud { position: absolute; left: 0; right: 0; top: 0; padding: .45em .7em 0; display: grid; gap: .35em; }
.hud-row { display: flex; align-items: center; gap: .45em; min-width: 0; }
.pill { display: inline-flex; align-items: center; gap: .4em; padding: .34em .7em; border-radius: 2em; background: rgba(12, 18, 36, .78); border: 1px solid var(--hair); white-space: nowrap; min-width: 0; }
#namePill { flex: 1 1 auto; overflow: hidden; }
#namePill .dot { width: .62em; height: .62em; border-radius: 50%; flex: none; }
#orgName { font-weight: 800; font-size: .86em; overflow: hidden; text-overflow: ellipsis; }
#agePill { flex: none; padding: .28em .65em; }
#ageTxt { font: 800 .9em/1 var(--font-num); font-variant-numeric: tabular-nums; }
.icon-btn { pointer-events: auto; flex: none; width: 2.3em; height: 2.3em; border-radius: 50%; border: 1px solid var(--hair); background: rgba(12, 18, 36, .8); color: var(--paper); display: grid; place-items: center; padding: 0; cursor: pointer; font: inherit; }
.icon-btn svg { width: 1.05em; height: 1.05em; display: block; }
#btnSpeed { font: 800 .72em/1 var(--font-num); width: 3.2em; height: 3.2em; }
#btnSpeed.on { background: var(--gold); color: var(--ink); border-color: var(--gold); }
.snd .i-off { display: none; }
.snd.off .i-on { display: none; }
.snd.off .i-off { display: block; }
.stage-row { display: flex; align-items: center; gap: .5em; min-width: 0; }
#stageTxt { flex: 1; min-width: 0; font-size: .74em; font-weight: 800; color: var(--paper); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-shadow: 0 1px 3px rgba(6,10,20,.9), 0 0 8px rgba(6,10,20,.5); }
.bar { height: .42em; margin: 0 .15em; border-radius: 1em; background: rgba(241, 244, 251, .14); box-shadow: inset 0 0 0 1px rgba(6, 10, 20, .22); overflow: hidden; }
#progFill { height: 100%; width: 0; border-radius: 1em; background: var(--mint); }
#scoreTxt { font: 800 .74em/1 var(--font-num); color: var(--gold); white-space: nowrap; font-variant-numeric: tabular-nums; text-shadow: 0 1px 3px rgba(6,10,20,.9), 0 0 8px rgba(6,10,20,.5); }
#timeline { display: flex; gap: 2px; height: .32em; padding: 0 .15em; }
#timeline i { flex: 1; border-radius: 1em; background: rgba(241, 244, 251, .14); box-shadow: inset 0 0 0 1px rgba(6, 10, 20, .22); }
#timeline i.done { background: rgba(143, 240, 200, .55); }
#timeline i.now { background: rgba(241, 244, 251, .8); }
#timeline.one { display: none; }

/* ---------- bottom controls ---------- */
#ctrl { position: absolute; left: 0; right: 0; bottom: 0; padding: 0 .8em .8em; display: grid; gap: .45em; justify-items: center; }
#holdHint { font-size: .74em; color: #c6cede; text-align: center; line-height: 1.4; min-height: 1.4em; word-break: keep-all; overflow-wrap: anywhere; text-shadow: 0 1px 3px rgba(6,10,20,.95), 0 0 10px rgba(6,10,20,.65); }
#btnHold { pointer-events: auto; width: 100%; max-width: 21em; height: 3.6em; border-radius: 1.2em; border: 2px solid rgba(143, 211, 255, .55); background: rgba(12, 18, 36, .78); color: var(--paper); font: 800 1.02em/1 var(--font-body); letter-spacing: .04em; cursor: pointer; touch-action: none; display: flex; align-items: center; justify-content: center; gap: .55em; }
#btnHold svg { width: 1.3em; height: 1.3em; }
#btnHold.on { background: var(--sky); color: var(--ink); border-color: var(--sky); box-shadow: 0 0 0 .3em rgba(143, 211, 255, .2), 0 0 1.4em rgba(143, 211, 255, .45); }
#btnHold:disabled { opacity: .55; border-color: var(--hair); cursor: default; }

/* ---------- banner ---------- */
#banner { position: absolute; left: .8em; right: .8em; top: 7.1em; display: flex; justify-content: center; pointer-events: none; }
#banner span { max-width: 100%; padding: .55em 1em; border-radius: .8em; background: var(--veil); border: 1px solid var(--hair); font-size: .84em; line-height: 1.45; text-align: center; word-break: keep-all; overflow-wrap: anywhere; opacity: 0; transform: translateY(-.5em); transition: opacity .25s, transform .25s; }
#banner.show span { opacity: 1; transform: none; }

/* ---------- panels ---------- */
.panel { position: absolute; inset: 0; pointer-events: auto; display: flex; flex-direction: column; align-items: center; text-align: center; padding: .9em max(16px, 1em); }
.title { overflow-y: auto; justify-content: space-between; background: linear-gradient(180deg, rgba(6, 10, 20, .72) 0%, rgba(6, 10, 20, .1) 30%, rgba(6, 10, 20, .1) 42%, rgba(6, 10, 20, .92) 60%); }
.logo { margin-top: .5em; display: grid; justify-items: center; gap: .3em; }
.logo h1 { margin: 0; font: 800 2.5em/1.05 var(--font-num); letter-spacing: .01em; color: var(--paper); text-shadow: 0 0 .5em rgba(143, 240, 200, .45); white-space: nowrap; font-variant-numeric: tabular-nums; }
.logo h1 sup { font-size: .5em; vertical-align: .95em; line-height: 0; margin-left: .03em; }
.logo h1 small { font-size: .62em; margin-left: .08em; color: var(--mint); }
.logo .kana { font-size: .8em; font-weight: 800; letter-spacing: .2em; padding-left: .2em; color: var(--mint); }
.logo .sub { font-size: .74em; color: var(--mist); font-weight: 700; line-height: 1.5; text-wrap: balance; word-break: keep-all; overflow-wrap: anywhere; }
.rules-card { width: min(100%, 21.5em); background: var(--veil); border: 1px solid var(--hair); border-radius: 1em; padding: .85em 1em .9em; display: grid; gap: .6em; }
.rules { list-style: none; margin: 0; padding: 0; display: grid; gap: .45em; text-align: left; }
.rules li { display: grid; grid-template-columns: 1.6em 1fr; gap: .5em; align-items: start; font-size: .8em; line-height: 1.5; word-break: keep-all; overflow-wrap: anywhere; }
.rules .num { width: 1.6em; height: 1.6em; border-radius: 50%; background: rgba(143, 240, 200, .16); color: var(--mint); display: grid; place-items: center; font: 800 .9em/1 var(--font-num); margin-top: .05em; }
.rules b { color: var(--mint); }
.scope-lbl { font-size: .7em; color: var(--mist); font-weight: 800; letter-spacing: .06em; }
.chips { display: flex; flex-wrap: wrap; gap: .35em; justify-content: center; }
.chip { pointer-events: auto; font: 800 .74em/1 var(--font-body); padding: .55em .8em; border-radius: 2em; border: 1px solid var(--hair); background: rgba(241, 244, 251, .06); color: var(--paper); cursor: pointer; }
.chip.on { background: var(--mint); color: var(--ink); border-color: var(--mint); }
#scopeNote { font-size: .72em; color: var(--mist); line-height: 1.45; word-break: keep-all; overflow-wrap: anywhere; }
#scopeNote b { color: var(--gold); font-family: var(--font-num); }
.btn { pointer-events: auto; font: 800 1.02em/1 var(--font-body); padding: .95em 2.2em; border-radius: 2em; border: 0; cursor: pointer; letter-spacing: .05em; }
.btn.primary { background: var(--mint); color: var(--ink); box-shadow: 0 0 0 .3em rgba(143, 240, 200, .16), 0 .6em 1.6em rgba(143, 240, 200, .22); }
.btn.ghost { background: rgba(12, 18, 36, .92); color: var(--paper); border: 1px solid var(--hair); }
.btn.small { font-size: .78em; padding: .7em 1.1em; letter-spacing: .02em; }
.btn:focus-visible, .icon-btn:focus-visible, .chip:focus-visible, #btnHold:focus-visible { outline: 3px solid var(--paper); outline-offset: 3px; }
.btn:active, .icon-btn:active, .chip:active { transform: scale(.98); }
.title-foot { display: flex; gap: .5em; align-items: center; justify-content: center; flex-wrap: wrap; }
.recs { font-size: .74em; color: var(--mist); font-variant-numeric: tabular-nums; line-height: 1.5; }
.land-hint { display: none; margin: 0; font-size: .75em; color: var(--mist); }
@media (orientation: landscape) and (pointer: coarse) { .land-hint { display: block; } }

.overlay { justify-content: center; background: rgba(6, 10, 20, .62); }
.card { width: min(100%, 20.5em); max-height: 100%; padding: 1.1em 1.1em; border-radius: 1em; background: var(--veil); border: 1px solid var(--hair); display: grid; gap: .6em; justify-items: center; }
.card h2 { margin: 0; font: 800 1.05em/1.25 var(--font-body); color: var(--mint); }
.note { margin: 0; font-size: .82em; line-height: 1.6; text-wrap: balance; word-break: keep-all; overflow-wrap: anywhere; }
.scroll { overflow-y: auto; -webkit-overflow-scrolling: touch; touch-action: pan-y; overscroll-behavior: contain; }

/* lottery */
#lottery .card { gap: .55em; }
.lv { width: 100%; display: grid; gap: .3em; }
.lv-h { font-size: .68em; color: var(--mist); font-weight: 800; letter-spacing: .05em; text-align: left; }
.lv-row { display: flex; flex-wrap: wrap; gap: .28em; }
.opt { font-size: .7em; font-weight: 800; padding: .45em .6em; border-radius: .6em; background: rgba(241, 244, 251, .06); border: 1px solid transparent; color: var(--mist); display: inline-flex; gap: .4em; align-items: baseline; }
.opt em { font: 800 .92em/1 var(--font-num); font-style: normal; color: var(--paper); opacity: .8; }
.opt.hi { border-color: var(--paper); color: var(--paper); background: rgba(241, 244, 251, .14); }
.opt.win { background: var(--mint); color: var(--ink); border-color: var(--mint); }
.opt.win em { color: var(--ink); }
#reveal { width: 100%; display: grid; gap: .45em; justify-items: center; }
#revKind { font-size: .72em; color: var(--mist); font-weight: 800; letter-spacing: .05em; }
#revName { margin: 0; font: 800 1.35em/1.25 var(--font-body); color: var(--paper); word-break: keep-all; overflow-wrap: anywhere; }
#revCanvas { width: 6.4em; height: 6.4em; display: block; }
#revPath { width: 100%; font-size: .7em; line-height: 1.6; color: var(--mist); font-weight: 800; word-break: keep-all; overflow-wrap: anywhere; }
#revPath em { font-style: normal; font-family: var(--font-num); color: var(--mint); }
.prob { display: grid; gap: .15em; }
.prob .lbl { font-size: .68em; color: var(--mist); font-weight: 800; }
#revProb { font: 800 1.55em/1.1 var(--font-num); color: var(--gold); font-variant-numeric: tabular-nums; }
#revProb small { font-size: .5em; color: var(--mist); display: block; margin-top: .25em; font-weight: 700; }
#revBirths, #revFact { font-size: .76em; line-height: 1.55; color: var(--paper); word-break: keep-all; overflow-wrap: anywhere; text-wrap: balance; margin: 0; }
#revBirths { color: var(--mist); }

/* result */
#resWhere { font-size: .78em; color: var(--mist); line-height: 1.5; margin: 0; word-break: keep-all; overflow-wrap: anywhere; }
#resCause { margin: 0; font: 800 1.02em/1.45 var(--font-body); word-break: keep-all; overflow-wrap: anywhere; text-wrap: balance; }
.big { font: 800 2.3em/1 var(--font-num); font-variant-numeric: tabular-nums; color: var(--gold); }
.big small { font-size: .36em; color: var(--mist); margin-left: .25em; font-weight: 800; }
#resPct { font-size: .82em; font-weight: 800; color: var(--paper); line-height: 1.45; word-break: keep-all; overflow-wrap: anywhere; }
.badge { font-size: .74em; padding: .35em .9em; border-radius: 1em; background: var(--gold); color: var(--ink); font-weight: 800; }
.stats { display: grid; grid-template-columns: 1fr 1fr; gap: .45em; margin: 0; width: 100%; }
.stats div { background: rgba(241, 244, 251, .06); border-radius: .7em; padding: .55em .45em; min-width: 0; }
.stats dt { font-size: .66em; color: var(--mist); font-weight: 700; }
.stats dd { margin: .3em 0 0; font: 800 .95em/1.15 var(--font-num); font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
.life-lbl { font-size: .7em; color: var(--mist); font-weight: 800; margin-bottom: -.3em; }
.facts { width: 100%; margin: 0; text-align: left; border-top: 1px solid var(--hair); }
.facts div { padding: .45em .1em; border-bottom: 1px solid var(--hair); display: grid; gap: .12em; }
.facts dt { font-size: .64em; color: var(--mist); font-weight: 800; letter-spacing: .02em; }
.facts dd { margin: 0; font-size: .78em; font-weight: 700; line-height: 1.5; word-break: keep-all; overflow-wrap: anywhere; font-variant-numeric: tabular-nums; }
.facts dd b { color: var(--gold); }
.facts dd em { color: var(--mint); font-style: normal; }
.facts dd small { color: var(--mist); font-weight: 700; }
.srcline { width: 100%; margin: 0; font-size: .64em; line-height: 1.5; color: var(--mist); text-align: left; word-break: keep-all; overflow-wrap: anywhere; }
.res-actions { position: sticky; bottom: -1.1em; width: calc(100% + 2.2em); margin: 0 -1.1em -1.1em; padding: .7em 1.1em 1em; display: grid; gap: .5em; background: linear-gradient(180deg, rgba(9, 14, 28, 0) 0%, rgba(9, 14, 28, .96) 22%); }
.beta { font-size: .62em; font-weight: 800; color: var(--gold); letter-spacing: .04em; }
#resKind { width: 100%; text-align: left; font-size: .74em; line-height: 1.55; color: var(--paper); background: rgba(241, 244, 251, .05); border-radius: .7em; padding: .6em .75em; margin: 0; word-break: keep-all; overflow-wrap: anywhere; }
#resKind b { color: var(--mint); }
.row-btns { display: flex; gap: .5em; justify-content: center; flex-wrap: wrap; }
.row-btns .btn { padding: .85em 1.4em; }
.copy-box { margin: 0; width: 100%; font-size: .74em; line-height: 1.5; padding: .6em .8em; border-radius: .6em; background: rgba(241, 244, 251, .08); user-select: text; -webkit-user-select: text; word-break: break-word; text-align: left; }
#result .card { overflow-y: auto; }

/* zukan & data */
.sheet { width: min(100%, 22em); height: 100%; display: flex; flex-direction: column; gap: .6em; padding: 1em .9em; border-radius: 1em; background: var(--veil); border: 1px solid var(--hair); }
.sheet-h { display: flex; align-items: center; gap: .6em; }
.sheet-h h2 { margin: 0; flex: 1; text-align: left; font: 800 1.05em/1.2 var(--font-body); color: var(--mint); }
.sheet-sub { margin: 0; font-size: .72em; color: var(--mist); text-align: left; line-height: 1.5; word-break: keep-all; overflow-wrap: anywhere; }
.sheet-body { flex: 1; min-height: 0; text-align: left; display: grid; align-content: start; gap: .35em; padding-right: .2em; }
.zk-g { font-size: .7em; font-weight: 800; color: var(--mist); margin: .5em 0 .1em; letter-spacing: .05em; display: flex; justify-content: space-between; }
.zk { pointer-events: auto; width: 100%; text-align: left; border: 1px solid var(--hair); background: rgba(241, 244, 251, .04); color: var(--paper); border-radius: .7em; padding: .55em .65em; display: grid; grid-template-columns: .65em 1fr auto; gap: .2em .55em; align-items: center; cursor: pointer; font: inherit; }
.zk .dot { width: .65em; height: .65em; border-radius: 50%; }
.zk .nm { font-size: .8em; font-weight: 800; min-width: 0; overflow-wrap: anywhere; }
.zk .pr { font: 800 .72em/1 var(--font-num); color: var(--gold); white-space: nowrap; }
.zk .more { grid-column: 2 / 4; font-size: .72em; line-height: 1.55; color: var(--paper); display: none; word-break: keep-all; overflow-wrap: anywhere; }
.zk.open .more { display: block; }
.zk.unk .nm { color: var(--mist); }
.src { font-size: .72em; line-height: 1.55; color: var(--paper); margin: 0; word-break: keep-all; overflow-wrap: anywhere; }
.src b { color: var(--mint); }
@media (prefers-reduced-motion: reduce) { #banner span { transition: none; } }
</style>

<div id="app">
  <canvas id="cv"></canvas>
  <div id="field">
    <div id="hud" hidden>

        <button id="btnPause" class="icon-btn" type="button">
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="6" y="5" width="4" height="14" rx="1.3" fill="currentColor"/><rect x="14" y="5" width="4" height="14" rx="1.3" fill="currentColor"/></svg>
        </button>
        <button id="btnSound" class="icon-btn snd" type="button">
          <svg class="i-on" viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 9.2h3.8L12.4 5v14l-5.1-4.2H3.5z" fill="currentColor"/><path d="M15.6 8.8a4.6 4.6 0 0 1 0 6.4M18.2 6.3a8.2 8.2 0 0 1 0 11.4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
          <svg class="i-off" viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 9.2h3.8L12.4 5v14l-5.1-4.2H3.5z" fill="currentColor"/><path d="M15.5 9.5l5 5M20.5 9.5l-5 5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
        </button>
      </div>

      </div>

    <section id="lottery" class="panel overlay" hidden>

      '<b>動物</b>：線虫 van den Hoogen et al. (2019) Nature、陸の節足動物 Rosenberg et al. (2023) PNAS、ナンキョクオキアミ Atkinson et al. (2009)、ヨコエソ WHOI、野鳥 Callaghan et al. (2021) PNAS、野生哺乳類 Greenspoon et al. (2023) PNAS、家畜の処理数 FAO 2022（Our World in Data）、養殖魚と甲殻類 fishcount (2022)。個体数から出生数への換算と、成長段階ごとの生存率は、寿命・産卵数と「親1匹あたり平均して次の世代を1匹残す」安定状態からの試算です。',
      '<b>人間</b>：国ごとの出生数は国連「世界人口推計2024」（2026年の推計値）、平均寿命は国連の2023年値、5歳未満死亡率は世界銀行の2023年値。年齢ごとの死亡率はこれらに合うなめらかな曲線で、死因の内訳はWHO世界保健推計の傾向を簡略化したものです。',
      '<b>結果の数値</b>：「ここまで生き延びる割合」は、守る操作をしなかった場合（現実の統計どおり）に、同じように生まれたもののうち何割がその時点まで生きるかです。細菌は分裂してもう一方の娘として生き続けた場合も含めます。',
      '多くの値は「桁が合っている」レベルの推定で、研究によって数倍の幅があります。ウイルスは生物に含めていません。',
      '<b>β版・更新履歴</b>：データはまだ作成途中で、この同じページで順次追加・修正していきます。2026-11-25 初公開（68種類）。2026-11-26 結果を点数から「現実の数値一覧」に変更。同日、題名を「いのちくじ」から「1.8×10³⁰分の1」に変更。題名の数字は、データを足して1年の出生数の合計が変わると、それに合わせて変わります。'
    ] : [
      '<b>Where the odds come from</b>: your next life is drawn by the number of new individuals born per year — cells from division for bacteria, eggs or young for animals, seeds for plants, spores for fungi. With these numbers, about ' + sci(W_ALL / YR) + ' lives begin on Earth every second.',
      '<b>Bacteria & archaea</b>: yearly cell production from Whitman, Coleman & Wiebe (1998) PNAS, “Prokaryotes: the unseen majority” (~1.7×10³⁰ cells/yr) split into open ocean, deep ocean, soil, subsurface and livestock guts. Cyanobacteria counts: Flombaum et al. (2013) PNAS; SAR11: Morris et al. (2002) Nature; human gut: Sender, Fuchs & Milo (2016) PLOS Biology. Shares within each group are rough estimates from typical observations.',
      '<b>How microbes die</b>: in the sea, viral lysis and grazing by protists kill bacteria at similar rates and together explain about 70% of deaths (Fuhrman & Noble 1995); viruses kill 20–40% of surface bacteria every day (Suttle 1994). In a stable population about half of all new cells reach division.',
      '<b>Protists</b>: estimated from densities in Zubkov & Tarran (2008) Nature and Pernice et al. (2015) ISME J. <b>Fungi</b>: Elbert et al. (2007) ACP spore emissions (~50 Tg/yr) converted at ~65 pg per spore. <b>Plants</b>: seed numbers are rough estimates.',
      '<b>Animals</b>: nematodes van den Hoogen et al. (2019) Nature; land arthropods Rosenberg et al. (2023) PNAS; Antarctic krill Atkinson et al. (2009); bristlemouths WHOI; wild birds Callaghan et al. (2021) PNAS; wild mammals Greenspoon et al. (2023) PNAS; livestock slaughter FAO 2022 (Our World in Data); farmed fish and crustaceans fishcount (2022). Turning head-counts into births, and survival at each life stage, are estimates from lifespans, fecundity and a stable population (each parent leaves one successor on average).',
      '<b>Humans</b>: births by country from UN World Population Prospects 2024 (2026 estimates); life expectancy from UN 2023; under-5 mortality from the World Bank 2023. Death rates by age follow a smooth curve fitted to those, and causes of death simplify WHO Global Health Estimates patterns.',
      '<b>The numbers in your result</b>: “survive this long” is the share of those born like you who would live as long without protecting (the real statistics). For microbes, carrying on as one of the daughter cells after a division counts as surviving.',
      'Most numbers are order-of-magnitude estimates; studies differ by a factor of several. Viruses are not counted as living things here.',
      '<b>Beta / changelog</b>: the data is still being built and will keep being added and corrected on this same page. 2026-11-25 first release (68 kinds). 2026-11-26 the result now lists real numbers instead of a score; the same day the title changed from “INOCHIKUJI” to “1 in 1.8×10³⁰”. The number in the title follows the total births per year in the data and will change as data is added.'
    ];
    var body = $('abBody'); body.innerHTML = '';
    P.forEach(function (h) { var p = document.createElement('p'); p.className = 'src'; p.innerHTML = h; body.appendChild(p); });
  }

  /* =========================================================
     Flow
     ========================================================= */
  function toTitle() {
    G.phase = 'title'; G.paused = false; G.life = null; G.lot = null; lockedLH = 0; layout();
    hideAll(); ui.title.hidden = false; hideBanner(); buildScopes(); refreshRecs(); setDefend(false);
  }
  function pauseGame() { if (G.phase !== 'life' || G.paused) return; G.paused = true; setDefend(false); ui.pause.hidden = false; try { $('btnResume').focus({ preventScroll: true }); } catch (e) {} }
  function resumeGame() { if (!G.paused) return; G.paused = false; ui.pause.hidden = true; SFX.ensure(); }
  function autoPolicy(name) {
    if (name === 'smart') return function (L) { for (var i = 0; i < L.threats.length; i++) { var th = L.threats[i]; if (th.st === 'come' && !th.deco && th.T - th.t < 0.32) return true; } return false; };
    return function () { return false; };
  }
  function update(dt) {
    G.clock += dt;
    if (G.bannerUntil && G.clock > G.bannerUntil) hideBanner();
    for (var i = pops.length - 1; i >= 0; i--) { pops[i].t += dt * 1.2; if (pops[i].t > 1) pops.splice(i, 1); }
    if (G.paused) return;
    G.phaseT += dt;
    if (G.phase === 'lottery') { lotteryStep(dt); return; }
    var L = G.life; if (!L) return;
    var gdt = dt * G.speed;
    L.fx.forEach(function (f) { f.t += dt; }); L.fx = L.fx.filter(function (f) { return f.t < 1.6; });
    if (G.phase === 'life') {
      stepLife(L, gdt, G.auto ? autoPolicy(G.auto) : null);
      if (L.alive && L.rt.act && L.defendT > 2.6 && !L.starveWarned) { L.starveWarned = true; showBanner(STR.starving + ' ' + STR.hintStarve, 2.2); }
      if (L.defendT < 0.5) L.starveWarned = false;
      if (!L.alive) { G.phase = 'dead'; G.phaseT = 0; setDefend(false); finishLife(); }
      return;
    }
    if (G.phase === 'dead') { L.deadT += dt; stepThreatsDead(L, dt); if (G.phaseT > 2.0) showResult(); }
  }
  function stepThreatsDead(L, dt) { L.threats.forEach(function (th) { if (th.st === 'leave') th.lt += dt; }); }

  /* =========================================================
     Input
     ========================================================= */
  function holdDown(e) {
    if (G.phase !== 'life' || G.paused) return;
    if (e.pointerType === 'mouse' && e.button !== 0) return;
    SFX.ensure();
    G.holdPtr = e.pointerId; setDefend(true);
    try { e.target.setPointerCapture(e.pointerId); } catch (err) {}
    if (e.cancelable) e.preventDefault();
  }
  function holdUp(e) { if (G.holdPtr === e.pointerId) { G.holdPtr = null; if (!G.keyHold) setDefend(false); } }
  ui.hold.addEventListener('pointerdown', holdDown);
  cv.addEventListener('pointerdown', holdDown);
  ['pointerup', 'pointercancel', 'lostpointercapture'].forEach(function (ev) { ui.hold.addEventListener(ev, holdUp); cv.addEventListener(ev, holdUp); });
  cv.addEventListener('contextmenu', function (e) { e.preventDefault(); });
  ui.hold.addEventListener('contextmenu', function (e) { e.preventDefault(); });
  app.addEventListener('touchmove', function (e) { if (e.target && e.target.closest && e.target.closest('.scroll')) return; if (e.cancelable) e.preventDefault(); }, { passive: false });
  $('btnStart').addEventListener('click', startRebirth);
  $('btnLive').addEventListener('click', startLife);
  $('lottery').addEventListener('click', function (e) { if (e.target && e.target.id === 'btnLive') return; if (G.lot && !G.lot.done) skipLottery(); });
  $('btnPause').addEventListener('click', pauseGame);
  $('btnResume').addEventListener('click', resumeGame);
  $('btnQuit').addEventListener('click', toTitle);
  $('btnRetry').addEventListener('click', startRebirth);
  $('btnTitle').addEventListener('click', toTitle);
  $('btnZukan').addEventListener('click', function () { openZukan('title'); });
  $('btnZukan2').addEventListener('click', function () { openZukan('result'); });
  $('btnZkClose').addEventListener('click', function () { ui.zukan.hidden = true; });
  $('btnData').addEventListener('click', function () { ui.about.hidden = false; try { $('btnAbClose').focus({ preventScroll: true }); } catch (e) {} });
  $('btnAbClose').addEventListener('click', function () { ui.about.hidden = true; });
  ui.btnSound.addEventListener('click', toggleSound);
  ui.btnSound2.addEventListener('click', toggleSound);
  ui.speed.addEventListener('click', function () { G.speed = G.speed > 1 ? 1 : 3; refreshSpeed(); });
  ui.btnCopy.addEventListener('click', copyResult);
  window.addEventListener('keydown', function (e) {
    var k = e.key;
    if (k === ' ' && G.phase === 'life') { e.preventDefault(); if (!e.repeat) { G.keyHold = true; setDefend(true); } return; }
    if (k === 'm' || k === 'M') { toggleSound(); return; }
    if (k === 'f' || k === 'F') { if (G.phase === 'life') { G.speed = G.speed > 1 ? 1 : 3; refreshSpeed(); } return; }
    if (k === 'Escape' || k === 'p' || k === 'P') {
      if (!ui.zukan.hidden) { ui.zukan.hidden = true; return; }
      if (!ui.about.hidden) { ui.about.hidden = true; return; }
      if (G.paused) resumeGame(); else pauseGame(); return;
    }
    if (k === 'Enter') {
      var ae = document.activeElement; if (ae && ae.tagName === 'BUTTON') return;
      if (G.phase === 'title' && ui.zukan.hidden && ui.about.hidden) { e.preventDefault(); startRebirth(); }
      else if (G.phase === 'lottery') { e.preventDefault(); if (G.lot && !G.lot.done) skipLottery(); else startLife(); }
      else if (G.phase === 'result' && ui.zukan.hidden) { e.preventDefault(); startRebirth(); }
      else if (G.paused) { e.preventDefault(); resumeGame(); }
    }
  });
  window.addEventListener('keyup', function (e) { if (e.key === ' ') { G.keyHold = false; if (G.holdPtr === null) setDefend(false); } });
  document.addEventListener('visibilitychange', function () { if (document.hidden) pauseGame(); });

  /* =========================================================
     Boot
     ========================================================= */
  var booted = false, last = 0;
  function frame(now) {
    var dt = (now - last) / 1000; last = now;
    if (!(dt > 0)) dt = 0; if (dt > 0.05) dt = 0.05;
    try { update(dt); render(); updateHud(); } catch (err) { if (window.console) console.error(err); }
    window.requestAnimationFrame(frame);
  }
  function boot(data) {
    if (booted) return; booted = true;
    if (data && data.rec && typeof data.rec === 'object') { for (var k in data.rec) if (REC[k] === undefined || k === 'seen' || k === 'bestBy' || (k === 'minBy' && data.rec[k] && typeof data.rec[k] === 'object') || typeof data.rec[k] === 'number') REC[k] = data.rec[k]; }
    if (data && typeof data.soundOn === 'boolean') soundOn = data.soundOn;
    SFX.setOn(soundOn);
    fillText();
    layout();
    if (window.ResizeObserver) { try { new ResizeObserver(function () { layout(); }).observe(app); } catch (e) { window.addEventListener('resize', layout); } }
    else window.addEventListener('resize', layout);
    window.addEventListener('orientationchange', function () { setTimeout(layout, 120); });
    last = performance.now();
    window.requestAnimationFrame(frame);
  }

  /* hooks used by automated checks */
  window.__inochikuji = {
    state: function () { var L = G.life; return { phase: G.phase, paused: G.paused, scope: G.scope, entry: L ? L.e.id : (G.birth ? G.birth.e.id : null), alive: L ? L.alive : null, stage: L ? L.si : null, prog: L ? +L.prog.toFixed(3) : 0, age: L ? L.age : 0, score: L ? Math.floor(L.lg * 100) : 0, surv: L ? lifeSurv(L) : 1, gen: L ? L.gen : 0, kids: L ? Math.floor(L.kids) : 0, defend: L ? L.defend : false, act: L ? L.rt.act : null, threats: L ? L.threats.length : 0, cause: L ? L.cause : null, rec: { best: REC.best, n: REC.n, seen: Object.keys(REC.seen).length }, audio: SFX.info(), LH: LH }; },
    force: function (id) { G.forced = id; },
    setScope: function (s) { if (SCOPE_BY[s]) { G.scope = s; buildScopes(); } },
    setAuto: function (p) { G.auto = p || null; },
    skip: function () { skipLottery(); },
    holdPoint: function () { var r = ui.hold.getBoundingClientRect(); return { x: r.left + r.width / 2, y: r.top + r.height / 2 }; },
    lotteryStats: function (sc, n) { var cnt = {}; for (var i = 0; i < n; i++) { var b = drawBirth(sc); cnt[b.e.k] = (cnt[b.e.k] || 0) + 1; } return cnt; },
    entryOdds: function (sc) { var w = sumW(scopeList(sc)), o = {}; scopeList(sc).forEach(function (e) { o[e.id] = e.w / w; }); return o; },
    simulate: function (id, policy, n, seed) {
      var e = EBY[id], pol = autoPolicy(policy || 'none'), out = { n: n, reach: [], scores: 0, gens: 0, kids: 0, lifespan: 0, causes: {} }, keep = rnd;
      if (seed) rnd = mulberry(seed);
      try {
        for (var i = 0; i < n; i++) {
          var b = { e: e, p: 1, pAll: e.w / W_ALL }; if (id === 'human') b.hum = drawHuman();
          var L = newLife(b), seen = {}, guard = 0;
          while (L.alive && guard++ < 200000) { seen[L.si] = 1; stepLife(L, 1 / 30, pol); }
          Object.keys(seen).forEach(function (k) { out.reach[k] = (out.reach[k] || 0) + 1; });
          out.scores += L.lg * 100; out.gens += L.gen; out.kids += L.kids; out.lifespan += L.age; out.causes[L.cause] = (out.causes[L.cause] || 0) + 1;
        }
      } finally { rnd = keep; }
      out.reach = out.reach.map(function (v) { return v ? +(v / n).toFixed(5) : 0; });
      out.scores /= n; out.gens /= n; out.kids /= n; out.lifespan /= n;
      return out;
    },
    kind: function (id) { return kindStats(EBY[id]); },
    titleName: function () { return { ja: TP.m + '×10' + sup(TP.e) + '分の1', total: W_ALL }; },
    gallery: function (pg, env) { G.gallery = pg; G.galleryEnv = env || 'sea'; hideAll(); return galleryItems().length; },
    humanCheck: function (ci, sex) { var c = HC[ci], m = humanModel(c, sex); var S5 = Math.exp(-m.Lam(5)), s = 0; for (var x = 0; x < 125; x += 0.05) s += Math.exp(-m.Lam(x + 0.025)) * 0.05; return { country: c[1], e0: +s.toFixed(2), target: sex === 'M' ? c[3] : c[4], u5: +((1 - S5) * 1000).toFixed(1), u5target: c[5], S80: +Math.exp(-m.Lam(80)).toFixed(3), S100: +Math.exp(-m.Lam(100)).toFixed(4) }; }
  };

  try {
    var hot = window.claude && window.claude.hot;
    if (hot && typeof hot.snapshot === 'function') hot.snapshot(function () { return { rec: REC, soundOn: soundOn }; });
    if (hot && typeof hot.ready === 'function') hot.ready(boot);
    else boot((hot && hot.data) || {});
  } catch (e) { boot({}); }
})();
</script>
